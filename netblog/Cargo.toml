[package]
name = "netblog"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A focused GTK4 blog editor for buwryy.net"
repository = "https://github.com/buwryme/buwryy.net"

[dependencies]
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
html-escape = "0.2"
libadwaita = { version = "0.9", features = ["v1_10"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sourceview5 = { version = "0.11", features = ["v5_12"] }
webkit6 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
