name: Patcher Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patcher-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh status badge
        run: |
          set -euo pipefail
          url='https://gist.githubusercontent.com/buwryme/300e8b1048933c9b2bdf43d2983224e6/raw/tiktok-patcher-status'
          value="$(curl -fsSL "$url?t=$(date +%s)" | tr -d '[:space:]')"
          case "$value" in
            1) message='working!'; color='green' ;;
            0) message='patched out...'; color='red' ;;
            *) echo "unexpected status value: '$value' - leaving badge unchanged"; exit 0 ;;
          esac
          printf '{"schemaVersion":1,"label":"patcher status","message":"%s","color":"%s"}\n' "$message" "$color" > .github/patcher-status.json

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- .github/patcher-status.json; then
            echo 'status unchanged'
            exit 0
          fi
          git add .github/patcher-status.json
          git commit -m 'chore: refresh patcher status badge'
          git push
