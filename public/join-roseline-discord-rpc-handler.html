<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Join Roblox · buwryy.net</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffbff;
        --card: #f7f2fa;
        --text: #1d1b20;
        --muted: #49454f;
        --primary: #6750a4;
        --on-primary: #ffffff;
        --outline: #79747e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141218;
          --card: #211f26;
          --text: #e6e0e9;
          --muted: #cac4d0;
          --primary: #d0bcff;
          --on-primary: #381e72;
          --outline: #938f99;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid color-mix(in srgb, var(--outline) 35%, transparent);
        border-radius: 28px;
        background: var(--card);
      }
      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        margin-bottom: 24px;
        border-radius: 16px;
        background: var(--primary);
        color: var(--on-primary);
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      .status {
        margin-bottom: 24px;
        color: var(--muted);
      }
      .actions {
        display: grid;
        gap: 10px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
      }
      .primary {
        background: var(--primary);
        color: var(--on-primary);
      }
      .secondary {
        border: 1px solid var(--outline);
        color: var(--primary);
      }
      .hint {
        margin-top: 24px;
        color: var(--muted);
        font-size: 13px;
      }
      .hidden {
        display: none;
      }
      .error {
        color: #ba1a1a;
      }
      @media (prefers-color-scheme: dark) {
        .error {
          color: #ffb4ab;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R</div>
      <h1>Join Roblox</h1>
      <p id="status" class="status">Asking your browser to hand this to Roblox.</p>
      <div id="actions" class="actions">
        <a id="open" class="primary" href="#">Open Roblox</a>
        <a id="view" class="secondary" href="https://www.roblox.com/">View game page</a>
      </div>
      <p class="hint">
        This page uses the <code>roblox://</code> link. If your browser blocks
        custom app links, open the game page or use a browser outside Flatpak.
      </p>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const placeId = (params.get("placeId") || "")
          .replace(/\D/g, "")
          .slice(0, 20);
        const rawJob = (params.get("gameInstanceId") || "").toLowerCase();
        const jobId =
          /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(
            rawJob,
          )
            ? rawJob
            : "";

        const status = document.getElementById("status");
        const open = document.getElementById("open");
        const view = document.getElementById("view");
        const actions = document.getElementById("actions");

        if (!placeId) {
          status.textContent = "This join link is missing a place id.";
          status.classList.add("error");
          actions.classList.add("hidden");
          return;
        }

        const deepLink = `roblox://experiences/start?placeId=${placeId}${
          jobId ? `&gameInstanceId=${jobId}` : ""
        }`;
        open.href = deepLink;
        view.href = `https://www.roblox.com/games/${placeId}`;

        // a hidden frame lets the browser try the scheme without replacing
        // this page when no handler is registered; the button is the
        // reliable, user-initiated path.
        const frame = document.createElement("iframe");
        frame.hidden = true;
        frame.src = deepLink;
        document.body.append(frame);

        window.setTimeout(() => {
          if (document.visibilityState === "visible") {
            status.textContent =
              "If nothing opened, press Open Roblox or use the game page.";
          }
        }, 2500);

        open.addEventListener("click", () => {
          status.textContent = "Waiting for your browser to open Roblox…";
        });
      })();
    </script>
  </body>
</html>
